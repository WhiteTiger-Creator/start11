name = "segment-index-reconciliation"

[metadata]
author_name = "Jonathan"
author_email = "jtolbert0175@gmail.com"
difficulty_explanation = '''The node runs a long-term support release, and the eleven release notes shipped beside it describe both the behaviour that release has and the behaviour four later releases replaced it with. Taking the newest description of any rule is the natural reading and is wrong in five separate places at once: version precedence goes back to sequence-only, collation folds case, tombstones survive as rows, recovered segments land at the wrong level, and the shard split follows key counts instead of stored bytes. Nothing in the environment flags which paragraphs apply; only the version the manifest pins does, and one earlier rule inside the deployed range was itself withdrawn by a later one that is still within range, so neither "newest wins" nor "oldest wins" survives contact with the data. The work is a dependent chain rather than a single repair. A compaction was interrupted with twelve segments written but never linked, one torn between its body and its trailer and one whose trailer count agrees while its checksum does not, so three of the twelve are thrown out and nine admitted; the first step is to decide admission, place and number what survives, merge every source under the deployed precedence, collation and tombstone rules, and rebuild both the compacted base and the repaired manifest at their expected paths. The shipped base holds only the cold level the compactor had finished and the shipped repaired manifest predates the unlinked segments entirely, so an engine repaired without that step reports a plausible index over a third of the tree. The level-0 compaction plan is the part that cannot be approximated. It is a subset selection maximising eliminated range overlap under TWO budgets at once -- the bytes the merge rewrites and the records it rewrites, charged in whole mebibytes and whole thousands respectively -- and the deployed release states in terms that the planner must return the attainable optimum. The two budgets do not track each other: on this tree the best selection under the byte budget alone rewrites 98,000 records against a budget of 88,000, so a planner that reads only the size bound returns an infeasible plan and one that treats the second bound as a filter over the first returns a feasible but worse one. A density-ordered greedy pass, which is what the migration branch does and what the shape of the problem invites, lands several percent below the optimum on this candidate set and fails outright on the tie-break order. A correct run finishes in about five seconds against the contract's 120-second budget, so the budget bounds the wrong approach rather than the right one. All figures are integers and the data is synthetic. In real life this is the work of a storage-engine or database-infrastructure engineer recovering a node after an interrupted compaction.'''
solution_explanation = '''solution/solve.sh drives the two dependent steps inside the environment container. Step one runs solution/reconcile_segments.py, which implements the rules active in the pinned release: an unlinked segment is admitted only when its trailer is present and both its record count and its checksum match the body actually on disk, so the torn segment is discarded whole rather than truncated; what survives enters at level 0 numbered from the checkpoint by ascending segment id; keys that are empty, over sixty-four bytes or control-bearing are dropped at merge time; the surviving version of a key is the one from the lowest level, then the highest sequence within that level, then the greatest segment id; keys collate by raw UTF-8 bytes; and a winning tombstone suppresses its key outright while still counting toward the key's version depth. It writes /app/data/compacted_base.jsonl and /app/data/manifest_repaired.json, the latter carrying the level-0 entries with the metadata the unlinked segments never had. Step two copies solution/rebuild_index_fixed.py over /app/workflow/rebuild_index.py and runs it: shard boundaries follow the running total of stored bytes and carry a window that cannot make min_shard_keys into the next shard, and the plan over the level plan_level names is solved exactly by a dynamic program whose objective packs the overlap score, the segment count, the charged size and a per-candidate bit into one integer, so the stated tie-breaks fall out of the optimisation instead of being applied afterwards. It writes exactly summary.json, shard_index.json and compaction_plan.jsonl into --output-dir.'''
verification_explanation = '''The separate verifier (tests/Dockerfile builds an isolated image the agent cannot see) collects the agent's whole /app as the declared artifact and runs tests/test_outputs.py against it. Step one is graded directly: the rebuilt base and repaired manifest must match sealed digests, carry only the declared fields and leave every segment file byte-identical, and the shipped partial base plus four wrong reconciliations (the torn segment truncated rather than discarded, sequence-only precedence, case-folded collation, tombstones retained as rows) are each asserted different from it, with the agent's own engine re-run over each and required to disagree with the sealed outputs. That is what makes the two steps provably dependent. Step two executes the agent's /app/workflow/rebuild_index.py as a subprocess under an unprivileged uid (setpriv 65534, scrubbed environment, hard timeout) over both the rebuilt base and a held-out alternate base, and diffs the three artifacts against sealed fixtures. The plan is additionally checked against the optimum recomputed independently in the verifier -- a packed backward table over both budgets against the reference's forward search over reachable loads, two formulations rather than the same code twice -- and against the best density-ordered, value-ordered and size-ordered greedy selections, which must all score strictly below it, so a heuristic planner cannot pass by luck. A separate check recomputes the best plan under the byte budget alone and requires it to overrun the record budget, so the second bound is proved to decide the answer rather than to decorate it. Schema, sort, budget, contiguity and summary-arithmetic invariants are asserted separately, along with idempotency and the command-line defaults. The shard boundaries are recomputed in the verifier from the release's own rule -- shard k closes at the first key whose running total of stored bytes reaches k/shard_count of the whole -- and compared exactly, with a companion assertion that an equal-key split of the same base would land elsewhere, so that check separates a byte split from a key-count split without any tuned tolerance. A separate crafted base puts the shard floor to work where one value dominates the whole base and meets every later target at once; v1.9's index section states the rule that settles it -- every shard takes at least one key the shards before it did not, and the window it is measured over runs from where its own scan began rather than from the boundary the last closed shard set -- so a split that measures the carried window from the last closed boundary folds the base into a single shard and is caught. The serialisation of the two reconciled artifacts is graded on the bytes as well as the content: the digests are format-insensitive, so a reconciler that wrote each base row with a space after every separator, or the manifest at another indent or without its trailing newline, matched every content check while breaking the layout the contract names for both files. No graded value is compared against a chosen constant: every one is an equality, a digest or a membership test, and the only inequalities in the suite are ones the task itself states -- the contract's 120-second budget, the policy's own merge budget, positivity of per-level counts and a floor asserting the graded base really is the large one. The reward channel is closed before any candidate code runs (/logs/verifier is created mode 700 and reward.txt mode 600, both written by root), and every candidate run is started in its own session with its output captured to temporary files rather than pipes and its whole process group killed before any artifact is read, so a double-forked grandchild can neither hold the run open past the budget nor still be executing while its files are graded. The frozen snapshot /app/workflow/.rebuild_index.original is asserted present by hash and wrong by output. The standard-library rule now reaches past the interpreter's own imports: the census wrapper installs an audit hook before the submission runs and records every program launched outside the process, so a rebuild that hands the byte ordering to /usr/bin/sort or starts a second python is named for it rather than passing on a spotless sys.modules. The discard list is perturbed in the tie worlds, so a summary carrying the shipped count as a literal is told apart from one that counts what the manifest holds, and the contract says what a base with fewer keys than shard_count yields: one shard per key and never an empty shard. No path a graded run is handed carries the identity of the case it belongs to: the crafted bases and the output directories are fresh root-owned directories named by a serial number, so a planner cannot read the tie-break criterion off its own argv, and root no longer writes a staged input at a guessable name inside the world-writable scratch area. The shard floor is graded on the windows themselves rather than their totals, since carrying a short window forward and folding it back into the shard already emitted give the same key and byte totals and differ only in where the keys land, and both budgets the summary echoes are now checked against a policy that varies rather than against the shipped value alone. The shard split is recomputed here from v1.9's own words rather than from the shipped base alone: every shard takes a key the shards before it did not, so a value large enough to carry the running total past several targets closes none of them on nothing, and a crafted base of a hundred bytes and two of one under three shards has to come back as three shards of one key each -- the case the graded base cannot reach, since no value there spans two targets. The module census now runs from a root-owned directory with -I, so neither the wrapper's own directory nor any environment path reaches sys.path and a file left in the candidate's work area cannot shadow what the wrapper imports. The standard-library rule is graded on what a run actually loads rather than on a scan of a directory: the rebuild is executed through a wrapper that writes down sys.modules afterwards, an empty script gives the interpreter's own baseline, and every module left over must be either standard library or a file the submission ships under /app, wherever it put it, with the sources the run did load also parsed for a module name assembled at run time. A separate probe holds seg-0095 to the checksum stream v1.3 now spells out, showing that the escaped and the literal readings of the same record give different digests and that the escaped one is the trailer's, so the segment's admission and everything downstream of it turn on the reading the release states. Five further checks close cases nothing used to reach. The pre-repair manifest at /app/data/manifest.json is hashed against a sealed digest, since the placement and numbering test recomputes its expectation from that file and a submission that wrote the admitted ids into it as well would have been failed by an expectation it had just rewritten. seg-0089's trailer now carries the checksum its body really has, so its record count is the only thing wrong with it and an engine that recomputes the checksum without comparing the trailer's count to the body on disk admits it and misses the base, the manifest and every artifact downstream; v1.7's third condition was previously pinned by no segment of its own. A run is made against a repaired manifest recording a different release and the summary has to report that release, since every run until then was made against a manifest saying 1.9 and the field could be a literal. A base carrying fewer keys than the ninety-six shards the policy asks for has to yield one shard per key with no empty shard, which is what the contract states and what no staged base used to reach. And the module census puts the submitted script's own directory on sys.path as an ordinary run of it would: -I had left it off, so a rebuild split across a sibling module under /app/workflow imported cleanly in every graded run and failed in the census alone. Confirmed locally in the real two-container flow: after solve.sh the verifier gives reward 1; a fresh environment gives 0, and so does an environment where the engine is repaired but the reconciliation is never run.'''
relevant_experience = '''Experience operating a log-structured storage engine through a failed compaction: reconciling segments that reached disk but were never linked into the manifest, deciding admission from a trailer that disagrees with the body, and applying the level, sequence, collation and tombstone semantics of the release a node actually runs rather than the newest release documented beside it. Also the planning side -- scoring range overlap across a level and choosing a merge set that is provably the best available under a pair of interacting budgets rather than a greedy approximation.'''
